- sensor:
    - name: "Puissance Reseau"
      unique_id: puissres
      device_class: "power"
      unit_of_measurement: "kW"
      state: "{{(states('sensor.envoy_122301074544_consommation_d_electricite_actuelle')|float(0) - states('sensor.envoy_122301074544_production_d_electricite_actuelle')|float(0))}}"
    - name: "Teinte 360"
      unique_id: huepuiss
      device_class: "illuminance"
      state: "{{(states('sensor.power_network')|float(0) * -40 + 120)|int(0)}}"
    - name: "Prix du Mwh"
      unique_id: mwhprice
      unit_of_measurement: "€/MWh"
      state: >
        {% set now = now() %}
        {% if (now.hour == 0 and now.minute >=54) or ( 0 < now.hour < 6) or (now.hour == 6 and now.minute< 54)%}
          {{192.7 | float(0) }}
        {% elif (now.hour == 14 and now.minute >=54) or (now.hour==15) or (now.hour == 16 and now.minute< 54)%}
          {{192.7 | float(0) }}
        {% else %}
          {{279.5 | float(0) }}
        {% endif %}
