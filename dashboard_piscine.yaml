views:
  - title: Piscine
    path: piscine
    icon: 'mdi:pool'
    badges:
      - entity: weather.forecast_maison
      - entity: sensor.piscine_e_fc
      - entity: sensor.piscine_pump_state
    cards:
      - type: vertical-stack
        cards:
          - type: horizontal-stack
            cards:
              - type: gauge
                entity: sensor.piscine_pool_water_temperature
                name: temp
                min: 15
                max: 35
                theme: Backend-selected
                severity:
                  green: 27
                  yellow: 31
                  red: 33
              - type: gauge
                entity: sensor.piscine_ph_mean
                name: ph
                min: 6.0
                max: 8
                theme: Backend-selected
                severity:
                  green: 6.95
                  yellow: 7.35
                  red: 7.75
              - type: gauge
                entity: sensor.piscine_orp_mean
                name: orp
                min: -1999
                max: 1999
                theme: Backend-selected
                severity:
                  green: 650
                  yellow: 600
                  red: 800

          - type: custom:mini-graph-card
            entities:
              - sensor.pool_evap_rate_cm_j
            name: Pool Evap Rate cm_j
            line_color: orange
            show:
              labels: false
              name: true
              icon: true
              state: true

          - type: glance
            show_name: false
            show_state: true
            entities:
              - entity: sensor.piscine_ezo_hw_temperature

          - type: entities
            title: Mesure Manuelle (FC)
            show_header_toggle: false
            entities:
              - entity: sensor.piscine_saisie_manuelle_fc
                name: Chlore libre mesuré (ppm)
              - entity: sensor.piscine_date_mesure_fc
                name: Date dernière mesure

          - type: horizontal-stack
            title: Fournitures
            cards:
              - type: gauge
                entity: sensor.piscine_remain_cycles
                name: Cycles restants
                min: 0
                max: 200
                theme: default
                severity:
                  green: 15
                  yellow: 10
                  red: 5
              - type: gauge
                entity: sensor.piscine_muriatic_tank
                name: Cuve acide
                min: 0
                max: 30
                theme: default
                severity:
                  green: 15
                  yellow: 5
                  red: 2

          - type: glance
            show_name: true
            show_state: false
            show_icon: true
            entities:
              - entity: switch.piscine_pump_hw
                name: Pompe
              - entity: switch.piscine_turbo_hw
                name: Robot
              - entity: binary_sensor.piscine_muriatic
                name: Acide
              - entity: binary_sensor.piscine_bleach
                name: Électrolyseur
              - entity: switch.piscine_javel_hw
                name: Javel

  - title: Historique
    path: historique
    panel: true
    icon: 'mdi:chart-line'
    cards:
      - type: horizontal-stack
        cards:
          - title: 3 Dernières heures
            type: history-graph
            hours_to_show: 3
            entities:
              - entity: sensor.piscine_pump_state
                name: État pompe
              - entity: switch.piscine_electrolyseur_hw
                name: Électrolyseur
              - entity: switch.piscine_javel_hw
                name: Javel
              - entity: switch.piscine_ph_hw
                name: Acide
              - entity: sensor.piscine_ph_mean
                name: pH
              - entity: sensor.piscine_orp_mean
                name: ORP
              - entity: sensor.piscine_pool_water_temperature
                name: Temp. eau
          - title: 3 Derniers jours
            type: history-graph
            hours_to_show: 72
            entities:
              - entity: sensor.piscine_pump_state
                name: État pompe
              - entity: switch.piscine_electrolyseur_hw
                name: Électrolyseur
              - entity: switch.piscine_javel_hw
                name: Javel
              - entity: switch.piscine_ph_hw
                name: Acide
              - entity: sensor.piscine_ph_mean
                name: pH
              - entity: sensor.piscine_orp_mean
                name: ORP
              - entity: sensor.piscine_pool_water_temperature
                name: Temp. eau

  - title: Chimie
    path: chimie
    icon: 'mdi:flask'
    cards:
      - type: horizontal-stack
        cards:
          - type: entities
            show_header_toggle: false
            entities:
              - label: Acide ( - pH )
                type: section
              - entity: sensor.piscine_muriatic_tank
                name: Niveau cuve
              - entity: sensor.piscine_muriatic_concentration
                name: Concentration
              - entity: sensor.piscine_muriatic_speed
                name: Débit injection
              - entity: switch.piscine_ph_hw
                name: Pompe injection (Lecture Seule)
              - entity: binary_sensor.piscine_lock_muriatic
                name: Verrouiller pompe
          - type: entities
            show_header_toggle: false
            entities:
              - label: Électrolyseur au sel (ORP)
                type: section
              - entity: sensor.piscine_bleach_concentration
                name: Rendement cellule (%)
              - entity: sensor.piscine_bleach_speed
                name: Débit de génération (g/h)
              - entity: sensor.piscine_duree_marche_cellule
                name: Durée de marche (prochaine)
              - entity: sensor.piscine_duree_marche_cellule_effective
                name: Temps de marche pris en compte (min)
              - entity: switch.piscine_electrolyseur_hw
                name: Cellule (Lecture Seule)
              - entity: binary_sensor.piscine_lock_bleach
                name: Verrouiller électrolyseur
          - type: entities
            show_header_toggle: false
            entities:
              - label: Chlore Liquide (Javel)
                type: section
              - entity: sensor.piscine_javel_volume_ml
                name: Volume (mL)
              - entity: sensor.piscine_javel_run_duration
                name: Durée d'injection (min)
              - entity: switch.piscine_javel_hw
                name: Pompe Javel
              - entity: binary_sensor.piscine_lock_javel
                name: Verrouiller Javel


  - title: Alertes
    path: alertes
    icon: 'mdi:message-alert'
    cards:
      - title: Notifications
        type: entities
        show_header_toggle: false
        entities:
          - entity: sensor.piscine_notify_cycles
            name: Alerte cycles filtration
          - entity: binary_sensor.piscine_notify_seasson
            name: Alertes changement de saison
          - entity: sensor.piscine_notify_muriatic_high
            name: Notifier niveau élevé acide 48h (l/48h)
          - entity: sensor.piscine_notify_muriatic_tank
            name: Notifier niveau réservoir acide (l)
          - entity: sensor.piscine_notify_bleach_high
            name: Temps de marche maximal 48h (h)
          - entity: sensor.piscine_javel_max_daily_vol
            name: Limite journalière Javel (mL)
          - entity: sensor.piscine_javel_max_daily_time
            name: Limite journalière Javel (min)

  - title: Réglages
    path: reglages
    icon: 'mdi:tune'
    cards:
      - title: Réglages piscine
        theme: default
        type: entities
        show_header_toggle: false
        entities:
          - label: Piscine
            type: section
          - entity: sensor.piscine_capacity
            name: Capacité
          - entity: sensor.piscine_quality
            name: Qualité
          - entity: sensor.piscine_recirculation
            name: Renouvellement
          - label: Robot (saisie directe)
            type: section
          - entity: binary_sensor.piscine_turbo
            name: Robot de nettoyage
          - entity: binary_sensor.piscine_robot_demarrage_solaire
            name: Robot démarrage sur solaire
          - entity: sensor.piscine_turbo
            name: "% du cycle avec robot"
          - entity: sensor.piscine_robot_cycle_start
            name: Heure démarrage robot
          - entity: sensor.piscine_robot_solar_max_minutes
            name: Temps max robot solaire (min)
          - label: Filtre
            type: section
          - entity: sensor.piscine_cycle_start
            name: Heure 1er cycle
          - entity: sensor.piscine_second_cycle_start
            name: Heure 2ᵉ cycle
          - entity: sensor.piscine_second_cycle
          - entity: sensor.piscine_pump_state
            name: Cycle actuel (MQTT)
          - entity: sensor.piscine_cycle

      - title: Réglages chimie
        type: entities
        show_header_toggle: false
        entities:
          - label: Désinfection (Électrolyseur ou Javel)
            type: section
          - entity: sensor.piscine_fc_target
            name: Cible désinfection (ppm)
          - entity: sensor.piscine_e_fc
            name: Désinfection actuelle (ppm)
          - entity: sensor.piscine_pool_mode
            name: Mode désinfection ZLT 75
          - entity: sensor.piscine_zlt_75_run_duration
            name: Durée calculée ZLT 75 (min)
          - entity: sensor.piscine_bleach_inject
            name: Quantité à produire (g)
          - entity: sensor.piscine_duree_marche_cellule
            name: Durée marche cellule (min)
          - entity: sensor.piscine_e_fc_adjust
            name: Ajustement ±% désinfection
          - entity: sensor.piscine_javel_pump_flow
            name: Débit pompe Javel (ml/min)
          - entity: sensor.piscine_javel_concentration
            name: Concentration Javel (%)
          - label: pH
            type: section
          - entity: sensor.piscine_ph_target
            name: Cible pH
          - entity: sensor.piscine_ph_mean
            name: pH actuel
          - entity: sensor.piscine_muriatic_inject
            name: Prochaine injection acide (ml)
